<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AR — Intro prototype</title>
<style>
:root{color-scheme:dark;--ink:#f7f3ef;--red:#ff263f;--radius:16px}*{box-sizing:border-box}body{margin:0;color:var(--foreground,#eee);font:14px var(--font-sans,Arial,sans-serif)}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--border,#444);border-radius:24px;padding:10px 17px;background:var(--secondary,#222);color:var(--foreground,#eee)}button:hover{border-color:var(--red)}button:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:4px}.stage{height:440px;position:relative;isolation:isolate;overflow:hidden;border-radius:var(--radius);padding:16px;background:#0c0c0f;color:var(--ink)}.hero{position:absolute;inset:0;padding:30px;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(ellipse at 90% 100%,#332029,transparent 65%),#101013}.nav{display:flex;align-items:center;justify-content:space-between;font-size:10px;letter-spacing:.15em}.nav svg{width:44px;height:24px}.hero h1{font-size:clamp(38px,7vw,62px);line-height:1.04;letter-spacing:-.055em;margin:16px 0;font-weight:500}.hero p{color:#aaa7b1;line-height:1.6;margin:0}.eyebrow,.foot{font-size:10px;letter-spacing:.16em;color:#aaa7b1}.foot{display:flex;justify-content:space-between}.intro{position:absolute;inset:0;background:radial-gradient(ellipse,#25080f 0%,#08080a 65%);display:grid;place-items:center;overflow:hidden}.logo{width:190px;height:103px;overflow:visible;filter:drop-shadow(0 8px 20px #ff123b44)}.scene{position:absolute;inset:0;display:grid;place-items:center}.echo{position:absolute;width:190px;height:103px;fill:none;stroke:#ff5c6d;stroke-width:1;opacity:.5}.detail{position:absolute;left:12%;top:20%;height:58%;width:60px;background:repeating-linear-gradient(90deg,transparent 0 7px,#d8fdfb 7px 8px);opacity:.18;transform:skewY(-25deg)}.tick{position:absolute;bottom:22px;left:24px;font:9px monospace;letter-spacing:.2em;color:#ac7c83}.progress{height:1px;position:absolute;bottom:0;left:0;right:0;background:#ff263f;transform-origin:left}.skip{position:absolute;top:16px;right:16px;font-size:10px;padding:7px 10px;background:#1119;color:#ccc;border-color:#ffffff20}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:16px 0 8px}.timeline{flex:1;min-width:100px;accent-color:var(--red)}.note{color:var(--muted-foreground,#999);font-size:12px;line-height:1.5;margin:6px 0 0}.time{font:11px monospace;min-width:62px}.paused-label{font-size:11px;color:var(--muted-foreground,#999)}@media(max-width:480px){.stage{height:420px}.hero{padding:24px}.nav span{font-size:8px}.controls{gap:8px}button{padding:10px 13px}}
</style></head><body>
<main><section class="stage" aria-label="AR intro animation prototype">
<div class="hero"><div class="nav"><svg viewBox="0 0 408 220"><use href="#mark" fill="#f7f3ef"/></svg><span>AYUSH RAMEJA / PORTFOLIO</span></div><div><span class="eyebrow">ENGINEER &amp; CREATOR</span><h1>Ideas into<br>things you can use.</h1><p>A space for the things I build.</p></div><div class="foot"><span>HERO PLACEHOLDER</span><span>INTRO STUDY / 01</span></div></div>
<div class="intro"><div class="detail"></div><div class="scene">
<svg class="echo e1" viewBox="0 0 408 220"><use href="#mark"/></svg><svg class="echo e2" viewBox="0 0 408 220"><use href="#mark"/></svg><svg class="echo e3" viewBox="0 0 408 220"><use href="#mark"/></svg>
<svg class="logo" viewBox="0 0 408 220" role="img" aria-label="AR logo"><defs><path id="mark" d="M22.085 215.765A10.000 10.000 0 0 1 13.616 200.448L128.439 17.543A10.000 10.000 0 0 1 145.396 17.573L173.159 62.140A10.000 10.000 0 0 0 190.135 62.140L223.417 8.713A10.000 10.000 0 0 1 231.905 4.000L385.830 4.000A10.000 10.000 0 0 1 394.278 19.351L339.886 105.233A10.000 10.000 0 0 1 331.438 109.882L310.405 109.882A10.000 10.000 0 0 0 301.957 125.233L349.572 200.414A10.000 10.000 0 0 1 341.124 215.765L320.092 215.765A10.000 10.000 0 0 1 311.644 211.115L250.918 115.233A10.000 10.000 0 0 1 250.918 104.532L266.938 79.238A10.000 10.000 0 0 1 275.386 74.588L309.085 74.588A10.000 10.000 0 0 0 317.533 69.939L327.219 54.645A10.000 10.000 0 0 0 318.771 39.294L254.209 39.294A10.000 10.000 0 0 0 245.761 43.944L207.389 104.532A10.000 10.000 0 0 0 207.389 115.233L261.337 200.414A10.000 10.000 0 0 1 252.889 215.765L199.817 215.765A10.000 10.000 0 0 1 191.369 200.414L200.611 185.821A10.000 10.000 0 0 0 200.611 175.120L145.464 88.046A10.000 10.000 0 0 0 128.526 88.113L80.568 165.188A10.000 10.000 0 0 0 89.059 180.471L110.209 180.471A10.000 10.000 0 0 0 118.700 175.754L140.290 141.055A10.000 10.000 0 0 1 157.229 140.987L167.700 157.520A10.000 10.000 0 0 1 167.742 168.154L141.053 211.048A10.000 10.000 0 0 1 132.562 215.765Z"/><linearGradient id="gloss" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fff1ec"/><stop offset=".18" stop-color="#ff687a"/><stop offset=".4" stop-color="#ff1836"/><stop offset=".65" stop-color="#a50023"/><stop offset=".85" stop-color="#ff4358"/><stop offset="1" stop-color="#ffbdc6"/></linearGradient></defs><use href="#mark" fill="#690a20" transform="translate(0 7)"/><use class="face" href="#mark" fill="url(#gloss)" stroke="#ff9ba8" stroke-width="1.3"/><use class="white" href="#mark" fill="#f7f3ef"/></svg></div><span class="tick">AR / INITIALIZING</span><div class="progress"></div></div><button class="skip" type="button">Skip intro ↗</button></section>
<div class="controls"><button id="replay" type="button">Replay ↻</button><button id="slow" type="button" aria-pressed="false">Slow motion</button><input class="timeline" type="range" min="0" max="2400" value="0" step="10" aria-label="Scrub animation"><output class="time">0.0 / 2.4s</output></div><p class="note">Motion prototype · approved rounded AR · silent · drag the timeline to inspect. Hero text and layout are placeholders.</p></main>
<script>
const $=s=>document.querySelector(s),duration=2400,animations=[];let slow=false,playing=false,raf;
function motion(s,frames){const a=$(s).animate(frames,{duration,fill:'both',easing:'linear'});a.pause();animations.push(a)}
motion('.scene',[{transform:'translate(14%,8%) rotate(-24deg) scale(7.6)',offset:0},{transform:'translate(-5%,2%) rotate(-16deg) scale(5.8)',offset:.22},{transform:'translate(0,0) rotate(0deg) scale(1)',offset:.58,easing:'cubic-bezier(.16,1,.3,1)'},{transform:'translate(0,0) rotate(0deg) scale(1)',offset:1}]);
for(let i=1;i<=3;i++)motion('.e'+i,[{transform:`translate(${i*18}px,${i*11}px) scale(${1+i*.08})`,opacity:.45,offset:0},{transform:`translate(${-i*24}px,${i*18}px) scale(${1+i*.18})`,opacity:.35,offset:.28},{transform:'translate(0,0) scale(1)',opacity:0,offset:.62},{opacity:0,offset:1}]);
motion('.white',[{opacity:0,offset:0},{opacity:0,offset:.48},{opacity:1,offset:.68},{opacity:1,offset:1}]);
motion('.detail',[{opacity:.2,transform:'translateY(0) skewY(-25deg)',offset:0},{opacity:.14,transform:'translateY(-50px) skewY(-25deg)',offset:.3},{opacity:0,offset:.55},{opacity:0,offset:1}]);
motion('.intro',[{opacity:1,transform:'translateY(0)',offset:0},{opacity:1,transform:'translateY(0)',offset:.76},{opacity:0,transform:'translateY(-22px)',offset:1}]);
motion('.hero',[{opacity:0,transform:'translateY(20px)',offset:0},{opacity:0,transform:'translateY(20px)',offset:.76},{opacity:1,transform:'translateY(0)',offset:1}]);
motion('.progress',[{transform:'scaleX(0)'},{transform:'scaleX(1)'}]);motion('.tick',[{opacity:1,offset:0},{opacity:0,offset:.6},{opacity:0,offset:1}]);
function ui(t){$('.timeline').value=t;$('.time').value=(t/1000).toFixed(1)+' / 2.4s';$('.skip').hidden=t>=duration;$('.intro').style.pointerEvents=t>=duration?'none':'auto'}
function seek(t){cancelAnimationFrame(raf);playing=false;animations.forEach(a=>{a.pause();a.currentTime=t});ui(t)}
function frame(){const t=Math.min(duration,Number(animations[0].currentTime)||0);ui(t);if(playing&&t<duration)raf=requestAnimationFrame(frame);else playing=false}
function play(){seek(0);playing=true;animations.forEach(a=>{a.playbackRate=slow?.35:1;a.play()});frame()}
$('#replay').onclick=play;$('#slow').onclick=()=>{slow=!slow;$('#slow').setAttribute('aria-pressed',String(slow));$('#slow').textContent=slow?'Speed: 0.35×':'Slow motion';animations.forEach(a=>a.updatePlaybackRate(slow?.35:1))};$('.timeline').oninput=e=>seek(Number(e.target.value));$('.skip').onclick=()=>seek(duration);
const reduced=matchMedia('(prefers-reduced-motion: reduce)');reduced.addEventListener('change',e=>{if(e.matches)seek(duration)});if(reduced.matches)seek(duration);else play();
</script></body></html>
