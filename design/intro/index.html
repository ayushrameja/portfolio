<script>
const $=s=>document.querySelector(s),duration=3200,animations=[];let slow=false,playing=false,raf;
function motion(s,frames){const a=$(s).animate(frames,{duration,fill:'both',easing:'linear'});a.pause();animations.push(a)}
// Millisecond storyboard; all tracks share one clock for replay and scrubbing.
function track(s,frames){motion(s,frames.map(([ms,props])=>({...props,offset:ms/duration})))}
track('.loading',[[0,{opacity:1,visibility:'visible'}],[299,{opacity:1,visibility:'visible'}],[300,{opacity:0,visibility:'hidden'}],[3200,{opacity:0,visibility:'hidden'}]]);
track('.scene',[[0,{transform:'translate(390px,180px) rotate(28deg) rotateY(0deg) scale(10.5)',opacity:0}],[300,{transform:'translate(390px,180px) rotate(28deg) rotateY(0deg) scale(10.5)',opacity:1}],[750,{transform:'translate(330px,145px) rotate(24deg) rotateY(0deg) scale(9)',opacity:1,easing:'cubic-bezier(.65,0,.25,1)'}],[1550,{transform:'translate(0,0) rotate(-8deg) rotateY(-28deg) scale(1)',opacity:1}],[1850,{transform:'translate(0,0) rotate(-8deg) rotateY(-28deg) scale(1)',easing:'cubic-bezier(.4,0,.2,1)'}],[2450,{transform:'translate(0,0) rotate(0deg) rotateY(0deg) scale(1.08)'}],[3200,{transform:'translate(0,0) rotate(0deg) rotateY(0deg) scale(1.08)'}]]);
track('.cage',[[0,{opacity:0,strokeDasharray:1400,strokeDashoffset:1400}],[1150,{opacity:0,strokeDashoffset:1400}],[1350,{opacity:.9,strokeDashoffset:1100}],[1700,{opacity:.9,strokeDashoffset:0}],[2100,{opacity:.9,strokeDashoffset:0}],[2350,{opacity:0,strokeDashoffset:0}],[3200,{opacity:0}]]);
for(let i=1;i<=3;i++)track('.e'+i,[[0,{opacity:0}],[300,{opacity:.05,transform:`translate(${i*12}px,${i*6}px)`}],[650,{opacity:.2,transform:`translate(${i*18}px,${i*8}px)`}],[1250,{opacity:0,transform:'translate(0,0)'}],[3200,{opacity:0}]]);
track('.white',[[0,{opacity:0}],[1800,{opacity:0}],[2420,{opacity:1}],[3200,{opacity:1}]]);
track('.detail',[[0,{opacity:0}],[300,{opacity:.22,transform:'translateY(20px) skewY(-25deg)'}],[800,{opacity:.18,transform:'translateY(-25px) skewY(-25deg)'}],[1400,{opacity:0}],[3200,{opacity:0}]]);
track('.intro',[[0,{opacity:1,transform:'translateY(0)'}],[2800,{opacity:1,transform:'translateY(0)'}],[3200,{opacity:0,transform:'translateY(-22px)'}]]);
track('.hero',[[0,{opacity:0,transform:'translateY(20px)'}],[2800,{opacity:0,transform:'translateY(20px)'}],[3200,{opacity:1,transform:'translateY(0)'}]]);
track('.progress',[[0,{opacity:0}],[3200,{opacity:0}]]);track('.tick',[[0,{opacity:0}],[3200,{opacity:0}]]);
function ui(t){$('.timeline').value=t;$('.time').value=(t/1000).toFixed(1)+' / 3.2s';$('.skip').hidden=t>=duration;$('.intro').style.pointerEvents=t>=duration?'none':'auto'}
function seek(t){cancelAnimationFrame(raf);playing=false;animations.forEach(a=>{a.pause();a.currentTime=t});ui(t)}
function frame(){const t=Math.min(duration,Number(animations[0].currentTime)||0);ui(t);if(playing&&t<duration)raf=requestAnimationFrame(frame);else playing=false}
function play(){seek(0);playing=true;animations.forEach(a=>{a.playbackRate=slow?.35:1;a.play()});frame()}
$('#replay').onclick=play;$('#slow').onclick=()=>{slow=!slow;$('#slow').setAttribute('aria-pressed',String(slow));$('#slow').textContent=slow?'Speed: 0.35×':'Slow motion';animations.forEach(a=>a.updatePlaybackRate(slow?.35:1))};$('.timeline').oninput=e=>seek(Number(e.target.value));$('.skip').onclick=()=>seek(duration);
document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>seek(Number(b.dataset.time)));
const reduced=matchMedia('(prefers-reduced-motion: reduce)');reduced.addEventListener('change',e=>{if(e.matches)seek(duration)});if(reduced.matches)seek(duration);else play();
